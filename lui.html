<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ricette Sane</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ricette">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F4F1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: hero arancione con doodle di cibo + saluto per profilo; cartelle a forma di cartellina vera; ricette in griglia foto */
:root{
  --bg:#F5F4F1; --soft:#FFFFFF; --line:#EAE6E1; --ink:#1A1714; --muted:#8A8079;
  --tint:#FFF1E7; --hero:#1E1A17; --shadow:0 1px 2px rgba(26,23,20,.04),0 8px 20px -6px rgba(26,23,20,.07);
  --orange:#FF6A13; --orange-deep:#E9550A; --accent:#FF6A13; --accent-ink:#D9560C;
  --t1:#FFFFFF; --t2:#FFFFFF; --t3:#FFFFFF; --t4:#FFFFFF;
  --good:#1F9D62; --warn:#C98200; --bad:#D9443A;
  --good-bg:#EAF7EF; --warn-bg:#FFF5DE; --bad-bg:#FDEDEB;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0E0D; --soft:#1A1816; --line:#2B2723; --ink:#F4F0EB; --muted:#9C928A;
  --tint:#2B1D13; --hero:#24201C; --shadow:none;
  --orange:#FF7323; --orange-deep:#E25A12; --accent:#FF7323; --accent-ink:#FF9A5C;
  --t1:#1A1816; --t2:#1A1816; --t3:#1A1816; --t4:#1A1816;
  --good:#4CCB8A; --warn:#F2B33D; --bad:#F06A5F;
  --good-bg:#16291F; --warn-bg:#2E2412; --bad-bg:#311715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E0D; --soft:#1A1816; --line:#2B2723; --ink:#F4F0EB; --muted:#9C928A;
  --tint:#2B1D13; --hero:#24201C; --shadow:none;
  --orange:#FF7323; --orange-deep:#E25A12; --accent:#FF7323; --accent-ink:#FF9A5C;
  --t1:#1A1816; --t2:#1A1816; --t3:#1A1816; --t4:#1A1816;
  --good:#4CCB8A; --warn:#F2B33D; --bad:#F06A5F;
  --good-bg:#16291F; --warn-bg:#2E2412; --bad-bg:#311715; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* HEADER */
.top{display:flex;align-items:center;gap:12px;padding:8px 0 22px}
.logo{width:48px;height:48px;flex:none}
.top h1{font-size:26px;font-weight:800}
.top p{margin:0;color:var(--muted);font-size:13px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:99px;padding:5px 12px 5px 5px;font-weight:700;font-size:14px;flex:none}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;flex:none}
.hello{margin-top:26px;font-size:15px;font-weight:600;opacity:.92}
.big-title{font-family:var(--display);font-weight:800;font-size:clamp(54px,17vw,84px);line-height:.88;letter-spacing:-.045em;margin:4px 0 0}
.big-title em{font-style:normal;display:inline-block;background:#fff;color:var(--orange);border-radius:18px;padding:0 .14em .04em;transform:rotate(-3deg);margin-left:.05em}
.hero-stats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.hs{background:rgba(255,255,255,.18);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:10px;text-align:left;color:#fff}
.hs b{font-family:var(--display);font-size:22px;font-weight:800;line-height:1;display:block}
.hs small{font-size:12px;opacity:.9;font-weight:600}
.ring{width:38px;height:38px;flex:none}

/* sezioni */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 2px 14px}
.sec h3{font-size:22px;font-weight:800}
.sec span{color:var(--muted);font-size:13px;font-weight:600}

/* cartelle con striscia arancione */
.folders{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.folder{border-radius:20px;padding:12px 10px 12px 18px;text-align:left;display:grid;gap:10px;align-content:space-between;transition:transform .15s;position:relative;overflow:hidden;min-width:0}
.folder::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--orange)}
.folder:active{transform:scale(.97)}
.folder .ic{width:34px;height:34px;border-radius:11px;background:var(--bg);display:grid;place-items:center;color:var(--orange)}
.folder .ic svg{width:19px;height:19px}
.folder b{font-family:var(--display);font-size:15px;font-weight:800;line-height:1.1;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .count{font-size:12px;color:var(--muted);font-weight:600;margin-top:1px;display:block}
.folder .n{position:absolute;right:10px;top:9px;font-family:var(--display);font-size:24px;font-weight:800;color:var(--orange);opacity:.85;line-height:1}
.f-colazione{background:var(--t1)} .f-pranzo{background:var(--t2)} .f-cena{background:var(--t1)} .f-snack{background:var(--t3)}
.f-sgarro{grid-column:span 2;grid-template-columns:auto 1fr;align-items:center;gap:10px;background:var(--t4)}
.f-sgarro .n{top:50%;transform:translateY(-50%)}

/* allenamenti */
.wk-days{display:grid;gap:8px}
.wk-day{display:grid;grid-template-columns:50px 1fr auto 16px;gap:12px;align-items:center;padding:9px 14px 9px 9px;border-radius:18px;background:var(--soft);text-align:left;position:relative;overflow:hidden;width:100%}
.wk-day:active{transform:scale(.98)}
.wk-d{width:50px;height:50px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.03em}
.wk-day.today{background:var(--t1)}
.wk-day.today::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--orange)}
.wk-day.today .wk-d{background:var(--orange);color:#fff}
.wk-info{min-width:0;display:grid}
.wk-info b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-info small{color:var(--muted);font-size:13px}
.wk-day.rest .wk-info b{color:var(--muted);font-weight:600}
.wk-tag{font-size:12px;font-weight:700;background:var(--orange);color:#fff;border-radius:99px;padding:3px 10px}
.wk-tag.ok{background:var(--good-bg);color:var(--good)}
.wk-day > svg{color:var(--muted)}
.f-head input.wk-title{font:inherit;font-family:var(--display);font-size:26px;font-weight:800;border:0;background:transparent;color:var(--ink);padding:0;width:100%;letter-spacing:-.02em;border-radius:0}
.f-head > div{min-width:0;flex:1}
.exlist{display:grid;gap:10px}
.ex{display:grid;grid-template-columns:28px 1fr 32px;gap:10px;align-items:start;background:var(--soft);border-radius:20px;padding:12px 8px 14px 14px}
.ex-chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--accent);display:grid;place-items:center;margin-top:6px}
.ex-chk svg{opacity:0}
.ex.done .ex-chk{background:var(--orange);border-color:var(--orange)}
.ex.done .ex-chk svg{opacity:1}
.ex-main{min-width:0;display:grid;gap:8px}
.ex input.ex-name{font:inherit;font-weight:700;font-size:16px;border:0;background:transparent;color:var(--ink);padding:6px 0;width:100%;border-radius:0}
.ex.done input.ex-name{text-decoration:line-through;color:var(--muted)}
.ex-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ex-nums label{display:grid;gap:4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.ex .ex-nums input{background:var(--bg);padding:10px 6px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border-radius:12px}
.ex-main small.ex-last{font-size:12.5px;color:var(--accent-ink);font-weight:600;text-transform:none;letter-spacing:0}
.ex-rm{width:32px;height:32px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.add-ex{width:100%;border:2px dashed var(--accent);border-radius:20px;padding:14px;color:var(--accent-ink);font-weight:700;margin-top:10px}
.hint-s{font-size:13px;color:var(--muted);text-align:center;margin:12px 8px 0}
.arch-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:16px;padding:4px;margin-bottom:14px}
.arch-seg button{padding:10px;border-radius:12px;font-weight:700;color:var(--muted)}
.arch-seg button.on{background:var(--bg);color:var(--orange);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.wkbox{background:var(--orange);color:#fff;border-radius:28px;padding:20px;display:grid;gap:14px}
.wkbox h3{font-size:22px;font-weight:800}
.wkbox .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.strip7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip7 div{display:grid;justify-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;opacity:.95}
.strip7 i{width:100%;max-width:38px;aspect-ratio:1;border-radius:11px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.strip7 i.on{background:#fff;color:var(--orange)}
.wtable{width:100%;border-collapse:collapse;font-size:14px}
.wtable td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.wtable td:nth-child(2),.wtable td:nth-child(3){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:12px}
.wtable td:nth-child(3){font-weight:700;color:var(--accent-ink)}
.wtable tr.skip td{color:var(--muted);text-decoration:line-through}
.prog{list-style:none;margin:6px 0 0;padding:0;display:grid}
.prog li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.prog li:first-child{border-top:0}
.prog li span{min-width:0}
.prog .up{color:var(--good);font-weight:700;white-space:nowrap}
.prog .eq{color:var(--muted);font-weight:600;white-space:nowrap}

/* griglia ricette con foto */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rc{display:grid;gap:8px;text-align:left;min-width:0}
.rc .ph{aspect-ratio:1;max-width:100%;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(140deg,var(--t2),var(--orange));display:grid;place-items:center;color:#fff}
.rc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.rc .kc{position:absolute;left:8px;bottom:8px;background:var(--bg);color:var(--ink);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.rc .kc i{width:8px;height:8px;border-radius:50%;display:block}
.rc .sg{position:absolute;right:8px;top:8px;background:var(--ink);color:var(--bg);border-radius:99px;padding:3px 9px;font-size:11px;font-weight:700}
.rc h4{margin:0;font-size:15px;font-weight:700;line-height:1.25;padding:0 2px}
.rc .sub{font-size:12.5px;color:var(--muted);padding:0 2px;margin-top:-4px}
.ex{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);padding:0 2px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);grid-column:1/-1}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:700}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-good{background:var(--good-bg);color:var(--good)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)}

/* barra */
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:40}
.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.tab{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0}
.tab.on{color:var(--orange)}
.fab{width:58px;height:58px;border-radius:20px;background:var(--orange);color:#fff;display:grid;place-items:center;margin-top:-20px;box-shadow:0 10px 22px -8px var(--orange);transform:rotate(-6deg);transition:transform .2s}
.fab:active{transform:rotate(0) scale(.95)}

/* pagine */
.page{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page .wrap{padding-block:0 120px}
.page.over{z-index:50}
.page.over .wrap{padding-block:0 40px}
.hdr{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.hdr h2{font-size:19px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-head{border-radius:28px;padding:20px 20px 20px 30px;margin-bottom:18px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.f-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--orange)}
.f-head .ic{width:54px;height:54px;border-radius:17px;background:var(--bg);display:grid;place-items:center;color:var(--orange);flex:none}
.f-head h1{font-size:32px;font-weight:800;line-height:1}
.f-head p{margin:4px 0 0;font-size:14px;opacity:.75}

.photo{aspect-ratio:4/3;max-width:100%;border-radius:28px;overflow:hidden;background:linear-gradient(140deg,var(--t2),var(--orange));display:grid;place-items:center;color:#fff}
.photo img{width:100%;height:100%;object-fit:cover}
.d-title{font-size:32px;font-weight:800;line-height:1.05;margin:18px 0 8px}
.d-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-weight:600}
.pill{background:var(--soft);border-radius:99px;padding:5px 12px}
.kcalbox{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border-radius:var(--r);padding:14px 16px;margin:16px 0}
.kcalbox .k{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.kcalbox .k small{font-family:var(--body);font-size:13px;font-weight:600}
.kcalbox p{margin:2px 0 0;font-size:13.5px;line-height:1.35;color:var(--ink);opacity:.8}
.kcalbox b{font-size:15px}
.k-good{background:var(--good-bg);color:var(--good)} .k-warn{background:var(--warn-bg);color:var(--warn)} .k-bad{background:var(--bad-bg);color:var(--bad)}
.block{border-radius:var(--r);padding:18px;margin-top:14px;background:var(--soft)}
.block h3{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px;font-family:var(--body);display:flex;justify-content:space-between;align-items:center}
.block h3 small{font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:700}
.checks{list-style:none;margin:0;padding:0;display:grid}
.checks li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.checks li:last-child{border-bottom:0}
.checks .tick{width:24px;height:24px;border-radius:8px;border:2px solid var(--accent);flex:none;display:grid;place-items:center;transition:background .15s}
.checks .tick svg{opacity:0}
.checks li.done{color:var(--muted);text-decoration:line-through}
.checks li.done .tick{background:var(--orange);border-color:var(--orange)}
.checks li.done .tick svg{opacity:1}
.steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:11px;background:var(--orange);color:#fff;font-weight:800;display:grid;place-items:center;font-family:var(--display);transform:rotate(-4deg)}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border-radius:16px;padding:14px 18px;font-weight:700;background:var(--soft)}
.btn.primary{background:var(--orange);color:#fff}
.btn.danger{color:var(--bad)}
.btn.wide{flex:1}

/* form */
.form{display:grid;gap:18px;margin-top:6px}
.f{display:grid;gap:6px;font-weight:600;font-size:14px}
.f .hint{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;width:100%;min-width:0}
textarea{min-height:130px;resize:vertical;line-height:1.5}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 14px;border-radius:99px;background:var(--soft);font-weight:600;font-size:14px}
.seg button.on{background:var(--orange);color:#fff}
.switch{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--t3);cursor:pointer;text-align:left;width:100%}
.switch .sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on .sw{background:var(--orange)}
.switch.on .sw::after{transform:translateX(18px)}
.switch span{display:grid;font-weight:700}
.switch small{font-weight:400;color:var(--muted);font-size:12.5px}
.ingrows{display:grid;gap:8px}
.ingrow{display:grid;grid-template-columns:24px 1fr 38px;gap:10px;align-items:center}
.ingrow .dot{width:22px;height:22px;border-radius:7px;border:2px solid var(--accent)}
.ingrow button{width:38px;height:38px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.addrow{justify-self:start;color:var(--orange);font-weight:700;padding:8px 2px}
.photo-pick{aspect-ratio:16/10;max-width:100%;border-radius:24px;border:2px dashed var(--accent);display:grid;place-items:center;text-align:center;color:var(--accent-ink);overflow:hidden;position:relative;cursor:pointer;background:var(--t3)}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kc-empty{background:var(--soft);border-radius:16px;padding:14px;color:var(--muted);font-weight:500;font-size:14px}
.kc-wait{background:var(--t1);border-radius:16px;padding:14px;color:var(--accent-ink);font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--t2);border-top-color:var(--orange);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.kc-row{display:flex;gap:18px;flex-wrap:wrap}
.kc-det{background:var(--soft);border-radius:16px;padding:12px 14px;margin-top:10px;font-weight:500;font-size:14px}
.kc-det summary{cursor:pointer;font-weight:700;color:var(--accent-ink)}
.kc-det ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.kc-det li{display:flex;justify-content:space-between;gap:10px}
.kc-det li span{min-width:0}
.kc-det p{margin:10px 0 0;color:var(--muted)}

/* archivio */
.todaybox{background:var(--orange);color:#fff;border-radius:28px;padding:20px;display:grid;gap:12px;position:relative;overflow:hidden;isolation:isolate}
.todaybox .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.todaybox h3{font-size:26px;font-weight:800;line-height:1.05}
.todaybox .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14px}
.todaybox .big{font-family:var(--display);font-size:32px;font-weight:800}
.meter{height:10px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .4s}
.todaybox ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.todaybox li{display:flex;justify-content:space-between;gap:10px}
.btn-white{background:#fff;color:var(--orange-deep);border-radius:16px;padding:13px 18px;font-weight:700;justify-self:start}
.day{border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.day .dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.day .dh b{font-size:16px;text-transform:capitalize}
.day ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.day li{display:flex;justify-content:space-between;gap:10px}
.day li .c{color:var(--muted);font-size:12px}
.minimeter{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.minimeter i{display:block;height:100%;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--soft);border-radius:18px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:800}
.stat span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:100px;padding-top:8px;position:relative}
.bars .col{flex:1;display:grid;justify-items:center;gap:4px;height:100%;align-content:end}
.bars .col i{width:100%;max-width:26px;border-radius:8px 8px 3px 3px;display:block}
.bars .col span{font-size:10px;color:var(--muted);text-transform:uppercase}
.bars .tgt{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.5}
.list{display:grid;gap:12px}

/* picker */
.pick-grp{margin-top:16px}
.pick-grp h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pick{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:16px;text-align:left;width:100%;border:1.5px solid transparent}
.pick .th{width:52px;height:52px;border-radius:14px;overflow:hidden;background:linear-gradient(140deg,var(--t2),var(--orange));display:grid;place-items:center;color:#fff}
.pick .th img{width:100%;height:100%;object-fit:cover}
.pick.on{border-color:var(--orange);background:var(--soft)}
.pick .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.pick.on .chk{background:var(--orange);border-color:var(--orange)}
.sticky-foot{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}

/* profili */
.prof{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:18px;width:100%;text-align:left;border:1.5px solid var(--line)}
.prof .avatar{width:44px;height:44px;font-size:19px;background:var(--orange);color:#fff}
.prof.on{border-color:var(--orange);background:var(--soft)}
.prof .chk{font-size:12px;font-weight:700;color:var(--orange)}
.note{font-size:13.5px;color:var(--muted);background:var(--soft);border-radius:16px;padding:14px;line-height:1.45}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* ---- stile moderno: neutri + accenti arancioni ---- */
.folder,.wk-day,.ex,.block,.card,.day,.stat,.f-head,.kc-det,.switch{box-shadow:var(--shadow)}
.folder::before,.f-head::before,.wk-day.today::before{display:none}
.folder,.wk-day,.ex,.block,.card,.day,.stat,.f-head,.switch{border:1px solid var(--line)}
.folder{background:var(--soft)!important;padding:12px}
.folder .ic,.f-head .ic{background:var(--tint);color:var(--orange)}
.folder .n{color:var(--ink);opacity:1;font-size:20px;right:12px;top:12px}
.f-sgarro .ic{background:var(--ink);color:var(--orange)}
.f-head{background:var(--soft)!important}
.wk-day,.wk-day.today{background:var(--soft)}
.wk-day.today{border-color:var(--orange)}
.wk-d{background:var(--bg);color:var(--ink)}
.wk-day.today .wk-d{background:var(--ink);color:var(--bg)}
.wk-tag{background:var(--tint);color:var(--accent-ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn{background:var(--soft);border:1px solid var(--line)}
.btn.primary{border-color:var(--ink)}
.fab{background:var(--orange);transform:none;border-radius:50%;margin-top:-22px}
.fab:active{transform:scale(.94)}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--orange)}
.seg button{background:var(--soft);border:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.todaybox,.wkbox{background:var(--hero);color:#fff}
.todaybox .eyebrow,.wkbox .eyebrow{color:var(--orange);opacity:1}
.meter{background:rgba(255,255,255,.14)}
.todaybox .meter i{background:var(--orange)}
.btn-white{background:var(--orange);color:#fff}
.strip7 i{background:rgba(255,255,255,.1)}
.strip7 i.on{background:var(--orange);color:#fff}
.steps li::before{background:var(--tint);color:var(--accent-ink);transform:none;border-radius:50%}
.thumb,.photo,.rc .ph,.pick .th{background:var(--tint);color:var(--orange)}
.block,.stat,.day,.card,.ex{background:var(--soft)}
input[type=text],input[type=number],textarea{background:var(--soft);border:1px solid var(--line)}
.ex .ex-nums input{background:var(--bg);border-color:transparent}
.ex input.ex-name,.f-head input.wk-title{border:0;background:transparent}
.switch{background:var(--soft)}
.photo-pick{background:var(--soft);border-color:var(--line);color:var(--muted)}
.add-ex{border:1.5px dashed var(--line);color:var(--ink);background:transparent}
.addrow{color:var(--accent-ink)}
.arch-seg{background:var(--line)}
.arch-seg button.on{background:var(--soft);color:var(--ink)}
.kc-wait{background:var(--tint)}
.kc-empty,.kc-det{background:var(--soft);border:1px solid var(--line)}
.checks .tick,.ex-chk,.ingrow .dot{border-color:var(--line)}
.block h3{color:var(--muted)}
/* esercizi allineati: nome in alto, numeri a tutta larghezza sotto */
.ex{grid-template-columns:28px 1fr 32px;align-items:center;row-gap:10px;padding:12px 10px 14px 14px}
.ex-main{display:contents}
.ex .ex-nums input{-webkit-appearance:none;appearance:textfield;-moz-appearance:textfield;text-align:center}
.ex .ex-nums input::-webkit-inner-spin-button,.ex .ex-nums input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ex-chk{grid-column:1;grid-row:1;margin-top:0}
.ex .ex-name{grid-column:2;grid-row:1;font:inherit;font-weight:700;font-size:16px;line-height:1.3;border:0;background:transparent;color:var(--ink);padding:4px 0;width:100%;min-height:0;resize:none;overflow:hidden;border-radius:0}
.ex.done .ex-name{text-decoration:line-through;color:var(--muted)}
.ex-nums{grid-template-columns:1fr 1.7fr 1fr}
.ex-rm{grid-column:3;grid-row:1}
.ex-nums{grid-column:1/-1;grid-row:2}
.ex-main small.ex-last{grid-column:1/-1;grid-row:3}
@keyframes pop{from{transform:translateY(8px) scale(.97);opacity:.6}to{transform:none;opacity:1}}
.folder{animation:pop .4s both}
.folder:nth-child(2){animation-delay:.05s}.folder:nth-child(3){animation-delay:.1s}.folder:nth-child(4){animation-delay:.15s}.folder:nth-child(5){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const CATS=[
 {id:"colazione",name:"Colazione",share:.25,sub:"Per iniziare bene"},
 {id:"pranzo",name:"Pranzo",share:.35,sub:"Il pasto forte"},
 {id:"cena",name:"Cena",share:.30,sub:"Leggero e buono"},
 {id:"snack",name:"Snack",share:.10,sub:"Fame a metà giornata"}
];
const SG_SHARE=.40;
const ICONS={
 colazione:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="4"/><path d="M12 3v2M4.9 6l1.4 1.4M19.1 6l-1.4 1.4M3 13h2M19 13h2M5 20h14"/></svg>',
 pranzo:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18a9 9 0 0 1-18 0Z"/><path d="M9 8c0-2 2-2 2-4M14 8c0-2 2-2 2-4"/></svg>',
 cena:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>',
 snack:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 7c-3-2-8-1-8 5s4 9 6 9c1 0 1.4-.5 2-.5s1 .5 2 .5c2 0 6-3 6-9s-5-7-8-5Z"/><path d="M12 7c0-2 1-4 3-4"/></svg>',
 sgarro:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .6-4.5 4 1.3 6L12 16.2 6.6 19.2l1.3-6-4.5-4 6-.6Z"/></svg>'
};
const BIG=(id,s=48)=>ICONS[id].replace('width="24" height="24"',`width="${s}" height="${s}"`);
const TICK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg>';

const SAMPLE=[
 {id:"s1",cat:"colazione",title:"Porridge proteico mela e cannella",kcal:340,time:10,example:true,
  ingredients:["40 g fiocchi d'avena","200 ml latte di mandorla senza zucchero","1 mela piccola a cubetti","15 g proteine in polvere vaniglia","Cannella q.b."],
  steps:["Scalda il latte con l'avena per 4-5 minuti mescolando.","Togli dal fuoco e incorpora le proteine.","Aggiungi la mela e una spolverata di cannella."]},
 {id:"s2",cat:"pranzo",title:"Bowl di pollo, quinoa e verdure",kcal:480,time:25,example:true,
  ingredients:["120 g petto di pollo","60 g quinoa (a crudo)","Zucchine e peperoni","1 cucchiaino olio EVO","Limone e paprika"],
  steps:["Cuoci la quinoa in acqua salata per 12 minuti.","Griglia il pollo con paprika e taglialo a strisce.","Salta le verdure in padella con poca acqua.","Componi la bowl e condisci con olio e limone."]},
 {id:"s3",cat:"cena",title:"Salmone al forno con broccoli",kcal:420,time:20,example:true,
  ingredients:["130 g filetto di salmone","250 g broccoli","1 cucchiaino olio EVO","Aglio, limone, sale"],
  steps:["Accendi il forno a 200°.","Disponi salmone e broccoli sulla teglia con olio e aglio.","Cuoci per 15-18 minuti e finisci con limone."]},
 {id:"s4",cat:"snack",title:"Yogurt greco e frutti rossi",kcal:150,time:3,example:true,
  ingredients:["150 g yogurt greco 0%","60 g frutti rossi","1 cucchiaino miele"],
  steps:["Metti lo yogurt in una ciotola.","Aggiungi i frutti rossi e il miele."]},
 {id:"s5",cat:"cena",sgarro:true,title:"Pizza light su base di yogurt",kcal:590,time:30,example:true,

  steps:["Impasta farina, yogurt e lievito.","Stendi sottile su carta forno.","Condisci con passata e mozzarella.","Cuoci a 220° per 12-15 minuti."]}
];

/* ---------- storage con profili ---------- */
const PKEY="ricetteLui.profiles";
const get=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
let P=get(PKEY)||{list:[{id:"p1",name:"Io"}],cur:"p1"};
let S=loadProfile(P.cur,true);
S.wk=S.wk||{plan:{},log:{}};
function loadProfile(id,first){
  const d=get("ricetteLui.data."+id); if(d&&d.recipes) return d;
  if(id==="p1"){const old=get("ricetteLui.none"); if(old&&old.recipes) return old;}
  if(first&&id==="p1"&&window.SEED){return JSON.parse(JSON.stringify(window.SEED))}
  if(false){
    const log={};
    [["s1","s2","s3"],["s1","s4","s2","s3"],["s1","s5","s4"]].forEach((ids,i)=>{const d=new Date();d.setDate(d.getDate()-(i+1));log[dk(d)]=ids.map(x=>snap(SAMPLE.find(r=>r.id===x)))});
    return {recipes:SAMPLE.map(r=>({...r})),target:1500,log,wk:sampleWk()};
  }
  return {recipes:[],target:1500,log:{}};
}
function save(){if(!put("ricetteLui.data."+P.cur,S))toast("Memoria piena: usa foto più leggere");put(PKEY,P)}
const me=()=>P.list.find(p=>p.id===P.cur);

function dk(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function snap(r){return {id:r.id,title:r.title,kcal:r.kcal,cat:r.cat,sgarro:!!r.sgarro}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catOf=id=>CATS.find(c=>c.id===id);
const folderName=id=>id==="sgarro"?"Sgarro leggero":catOf(id).name;
const inFolder=(r,f)=>f==="sgarro"?!!r.sgarro:r.cat===f;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800)}
const todayTot=()=>(S.log[dk(new Date())]||[]).reduce((a,b)=>a+(+b.kcal||0),0);

function evaluate(kcal,cat,sg){
  kcal=+kcal; if(!kcal) return null;
  const c=catOf(cat);
  if(sg){
    const b=Math.round(S.target*SG_SHARE),r=kcal/b;
    if(r<=1) return {cls:"good",label:"Sgarro furbo",text:`Sta in ${b} kcal: te lo concedi restando nel tuo obiettivo.`};
    if(r<=1.3) return {cls:"warn",label:"Sgarro pieno",text:`Supera di ${kcal-b} kcal la quota sgarro. Alleggerisci gli altri pasti.`};
    return {cls:"bad",label:"Fuori obiettivo",text:`Con ${kcal} kcal rischi di sforare il giorno. Prova una porzione più piccola.`};
  }
  const b=Math.round(S.target*c.share),r=kcal/b;
  if(r<=1) return {cls:"good",label:"Ok per il deficit",text:`Rientra nella quota ${c.name.toLowerCase()} di ${b} kcal (su ${S.target} al giorno).`};
  if(r<=1.25) return {cls:"warn",label:"Un po' alta",text:`Supera di ${kcal-b} kcal la quota di ${b}. Compensa con uno snack leggero.`};
  return {cls:"bad",label:"Troppo per il deficit",text:`Supera di ${kcal-b} kcal la quota di ${b}. Riduci porzioni o condimenti.`};
}
const dotCol=c=>({good:"var(--good)",warn:"var(--warn)",bad:"var(--bad)"}[c]);
const ph=r=>r.photo?`<img src="${r.photo}" alt="">`:BIG(r.sgarro?"sgarro":r.cat);

/* ---------- home ---------- */
function greet(){const h=new Date().getHours();return h<12?"Buongiorno":h<18?"Buon pomeriggio":"Buonasera"}
function renderHome(){
  const p=me();
  $("#totCount").textContent=S.recipes.length+" ricette";
  renderWk();
  $("#folders").innerHTML=CATS.map(c=>c.id).concat("sgarro").map(id=>{
    const n=S.recipes.filter(r=>inFolder(r,id)).length;
    return `<button class="folder f-${id}" data-folder="${id}"><span class="ic">${ICONS[id]}</span>
      <span><b>${folderName(id)}</b><span class="count num">${n} ricett${n===1?"a":"e"}</span></span><span class="n num">${n}</span></button>`}).join("");
}

/* ---------- pagine ---------- */
function openPage(html,layer="p1"){const p=$("#"+layer);p.innerHTML=`<div class="wrap">${html}</div>`;p.hidden=false;p.scrollTop=0;document.body.style.overflow="hidden"}
function closeLayer(layer){$("#"+layer).hidden=true;if($("#p1").hidden&&$("#p2").hidden){document.body.style.overflow="";setTab("home");curFolder=null;renderHome()}}
const back=l=>`<button class="icon-btn" data-close="${l}" aria-label="Indietro"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>`;

let curFolder=null;
function showFolder(id){
  curFolder=id; setTab("home");
  const rs=S.recipes.filter(r=>inFolder(r,id));
  const bg={colazione:"var(--t1)",pranzo:"var(--t2)",cena:"var(--t1)",snack:"var(--t3)",sgarro:"var(--t4)"}[id];
  const fg="var(--ink)";
  const sub=id==="sgarro"?"Le ricette che segni tu come sgarro":catOf(id).sub;
  openPage(`<div class="hdr">${back("p1")}<h2></h2></div>
   <div class="f-head" style="background:${bg};color:${fg}"><span class="ic">${ICONS[id]}</span><div><h1>${folderName(id)}</h1><p>${sub} · ${rs.length} ricett${rs.length===1?"a":"e"}</p></div></div>
   <div class="grid">${rs.length?rs.map(r=>{const ev=evaluate(r.kcal,r.cat,r.sgarro);return `
    <button class="rc" data-open="${r.id}"><div class="ph">${ph(r)}<span class="kc">${ev?`<i style="background:${dotCol(ev.cls)}"></i>`:""}<span class="num">${r.kcal||"—"} kcal</span></span>${r.sgarro&&id!=="sgarro"?'<span class="sg">Sgarro</span>':""}</div>
      ${r.example?'<span class="ex">Esempio</span>':""}<h4>${esc(r.title)}</h4><span class="sub">${r.time?r.time+" min":""}${id==="sgarro"?(r.time?" · ":"")+catOf(r.cat).name:""}</span></button>`}).join("")
    :`<div class="empty">Ancora niente qui.<br>Tocca + per aggiungere la prima ricetta.</div>`}</div>`,"p1");
}

function showRecipe(id){
  const r=S.recipes.find(x=>x.id===id); if(!r) return;
  const ev=evaluate(r.kcal,r.cat,r.sgarro);
  openPage(`<div class="hdr">${back("p2")}<h2>${catOf(r.cat).name}${r.sgarro?" · Sgarro":""}</h2>
    <button class="icon-btn" data-edit="${r.id}" aria-label="Modifica"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16Z"/></svg></button></div>
    <div class="photo">${ph(r)}</div>
    <h1 class="d-title">${esc(r.title)}</h1>
    <div class="d-meta">${r.time?`<span class="pill">${r.time} min</span>`:""}<span class="pill">${r.ingredients.length} ingredienti</span>${(r.servings||1)>1?`<span class="pill">${r.servings} porzioni</span>`:""}${r.sgarro?'<span class="pill">Sgarro leggero</span>':""}</div>
    ${ev?`<div class="kcalbox k-${ev.cls}"><div class="k num">${r.kcal}<small> kcal</small></div><div><b>${ev.label}</b><p>${ev.text}</p></div></div>`:""}
    <div class="block"><h3>Ingredienti <small id="ingCount">0 / ${r.ingredients.length}</small></h3>
      <ul class="checks" id="ingList">${r.ingredients.map((i,n)=>`<li><span class="tick">${TICK}</span><span style="flex:1;min-width:0">${esc(i)}</span>${r.kcalSig&&r.kcalDetail?.[n]?`<small class="num" style="color:var(--muted);font-weight:600">${r.kcalDetail[n].kcal} kcal</small>`:""}</li>`).join("")}</ul></div>
    <div class="block"><h3>Procedimento</h3><ol class="steps">${r.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol></div>
    <div class="actions"><button class="btn primary wide" data-eat="${r.id}">Ho mangiato questa oggi</button><button class="btn" data-edit="${r.id}">Modifica</button></div>`,"p2");
  $("#ingList").addEventListener("click",e=>{const li=e.target.closest("li");if(!li)return;li.classList.toggle("done");$("#ingCount").textContent=$("#ingList").querySelectorAll(".done").length+" / "+r.ingredients.length});
}

let draft=null;
function showEditor(id){
  const r=id?S.recipes.find(x=>x.id===id):null;
  const startCat=curFolder&&curFolder!=="sgarro"?curFolder:"pranzo";
  draft=r?JSON.parse(JSON.stringify(r)):{id:"r"+Date.now(),cat:startCat,sgarro:curFolder==="sgarro",title:"",kcal:"",time:"",ingredients:[],steps:[],photo:""};
  const ingRow=v=>`<div class="ingrow"><span class="dot"></span><input type="text" class="ingIn" value="${esc(v)}" placeholder="Es. 120 g petto di pollo, oppure incolla una lista"><button type="button" data-rm aria-label="Togli"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
  const ings=draft.ingredients.length?draft.ingredients:[""];
  openPage(`<div class="hdr">${back("p2")}<h2>${r?"Modifica ricetta":"Nuova ricetta"}</h2></div>
   <form class="form" id="ed">
    <label class="photo-pick" id="pp">${draft.photo?`<img src="${draft.photo}" alt="">`:`<span>${BIG("pranzo",36)}<br><b>Aggiungi una foto</b><br><small>Tocca per scegliere dalla galleria</small></span>`}<input type="file" accept="image/*" id="photoIn"></label>
    <label class="f">Nome della ricetta<input type="text" id="fTitle" value="${esc(draft.title)}" placeholder="Es. Insalata di farro e ceci"></label>
    <div class="f">Cartella<div class="seg" id="seg">${CATS.map(c=>`<button type="button" data-cat="${c.id}" class="${draft.cat===c.id?"on":""}">${c.name}</button>`).join("")}</div></div>
    <button type="button" class="switch ${draft.sgarro?"on":""}" id="sgSw"><span class="sw"></span><span>Sgarro leggero del weekend<small>Attivalo solo se vuoi metterla anche nella cartella sgarro</small></span></button>
    <div class="two"><label class="f">Porzioni<input type="number" inputmode="numeric" id="fServ" value="${draft.servings||1}" min="1"></label>
      <label class="f">Minuti<input type="number" inputmode="numeric" id="fTime" value="${draft.time||""}" placeholder="20"></label></div>
    <div class="f">Ingredienti <span class="hint">Scrivili o incolla una lista intera con i pallini: li separo io</span>
      <div class="ingrows" id="ingRows">${ings.map(ingRow).join("")}</div>
      <button type="button" class="addrow" id="addIng">+ Aggiungi ingrediente</button></div>
    <div class="f">Kcal a porzione<div id="kcalArea"></div></div>
    <label class="f">Procedimento <span class="hint">Un passaggio per riga</span><textarea id="fSteps" placeholder="Cuoci la quinoa per 12 minuti&#10;Griglia il pollo">${esc(draft.steps.join("\n"))}</textarea></label>
    <div class="actions"><button class="btn primary wide" type="submit">Salva ricetta</button>${r?`<button class="btn danger" type="button" data-del="${r.id}">Elimina</button>`:""}</div>
   </form>`,"p2");
  if(r&&r.kcal&&!r.kcalSig) draft.kcalManual=true;
  const curIngs=()=>[...document.querySelectorAll(".ingIn")].map(i=>i.value.trim()).filter(Boolean);
  const servs=()=>Math.max(1,+$("#fServ").value||1);
  const sig=()=>JSON.stringify(curIngs());
  let busy=false,timer=null,err="";
  const evHtml=k=>{const ev=evaluate(k,draft.cat,draft.sgarro);return ev?`<div class="kcalbox k-${ev.cls}" style="margin:0"><div class="k num">${k}<small> kcal</small></div><div><b>${ev.label}</b><p>${ev.text}</p></div></div>`:""};
  const upd=()=>{
    const A=$("#kcalArea"); if(!A) return;
    if(busy){A.innerHTML=`<div class="kc-wait"><span class="spin"></span>Calcolo le kcal degli ingredienti…</div>`;return}
    if(draft.kcalManual){
      if(!$("#fKcal")) A.innerHTML=`<input type="number" inputmode="numeric" id="fKcal" value="${draft.kcal||""}" placeholder="420"><div id="evBox" style="margin-top:10px"></div><div class="kc-row"><button type="button" class="addrow" id="autoK">Calcola in automatico</button></div>`;
      $("#evBox").innerHTML=evHtml(draft.kcal);return}
    if(!curIngs().length){A.innerHTML=`<div class="kc-empty">Scrivi gli ingredienti con le quantità e le kcal compaiono qui.</div>`;return}
    if(err){A.innerHTML=`<div class="kc-empty">${esc(err)}</div><div class="kc-row"><button type="button" class="addrow" id="reK">Riprova</button><button type="button" class="addrow" id="manK">Scrivile a mano</button></div>`;return}
    if(draft.kcalSig!==sig()){A.innerHTML=`<div class="kc-empty">Calcolo appena finisci di scrivere…</div>`;return}
    draft.kcal=Math.round((draft.kcalTotal||0)/servs());
    A.innerHTML=`${evHtml(draft.kcal)}<details class="kc-det"><summary>Dettaglio per ingrediente</summary><ul>${(draft.kcalDetail||[]).map(x=>`<li><span>${esc(x.ingredient)}</span><b class="num">${x.kcal}</b></li>`).join("")}</ul><p>Totale ricetta <b class="num">${draft.kcalTotal}</b> kcal · ${servs()} porzion${servs()===1?"e":"i"}</p></details>
      <div class="kc-row"><button type="button" class="addrow" id="reK">Ricalcola</button><button type="button" class="addrow" id="manK">Scrivile a mano</button></div>`;
  };
  async function calc(){
    const ings=curIngs(); if(!ings.length){upd();return}
    const s=sig(); busy=true; err=""; upd();
    try{
      const res=await fetch("/.netlify/functions/kcal",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("#fTitle").value,ingredients:ings})});
      const j=await res.json().catch(()=>({}));
      if(!res.ok||!Array.isArray(j.items)) throw new Error(j.error||"");
      draft.kcalDetail=j.items; draft.kcalTotal=j.total; draft.kcalSig=s;
    }catch(e){err=(e.message&&!/fetch|load/i.test(e.message))?e.message:"Non riesco a calcolare le kcal adesso. Il calcolo funziona sul sito pubblicato su Netlify."}
    busy=false; upd();
  }
  const schedule=()=>{if(draft.kcalManual)return;err="";clearTimeout(timer);upd();timer=setTimeout(()=>{if(sig()!==draft.kcalSig)calc()},1500)};
  upd();
  if(!draft.kcalManual&&curIngs().length&&draft.kcalSig!==sig()) schedule();
  $("#ingRows").addEventListener("input",schedule);
  $("#fServ").addEventListener("input",upd);
  $("#kcalArea").addEventListener("click",e=>{const id=e.target.id;
    if(id==="reK"){draft.kcalSig="";calc()}
    else if(id==="manK"){draft.kcalManual=true;upd();$("#fKcal")?.focus()}
    else if(id==="autoK"){draft.kcalManual=false;draft.kcalSig="";$("#kcalArea").innerHTML="";calc()}});
  $("#kcalArea").addEventListener("input",e=>{if(e.target.id==="fKcal"){draft.kcal=+e.target.value||0;$("#evBox").innerHTML=evHtml(draft.kcal)}});
  $("#seg").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;draft.cat=b.dataset.cat;$("#seg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));upd()});
  $("#sgSw").addEventListener("click",()=>{draft.sgarro=!draft.sgarro;$("#sgSw").classList.toggle("on",draft.sgarro);upd()});
  $("#addIng").addEventListener("click",()=>{$("#ingRows").insertAdjacentHTML("beforeend",ingRow(""));const all=$("#ingRows").querySelectorAll("input");all[all.length-1].focus()});
  $("#ingRows").addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(b){b.parentElement.remove();schedule()}});
  const BUL=/[•·●▪◦‣■☐]/;
  const splitIngs=t=>t.replace(/\r/g,"").split(/\n|[•·●▪◦‣■☐]\s*/)
    .map(l=>l.replace(/^\s*(?:\p{Extended_Pictographic}\uFE0F?|[-–—*+✓✔]|\d+[.)](?=\s))\s*/u,"").trim())
    .filter(l=>l&&!/^ingredienti\b[^a-z0-9]*$/i.test(l));
  const fillFrom=(inp,parts)=>{const row=inp.closest(".ingrow");inp.value=parts[0]||"";let after=row;
    parts.slice(1).forEach(v=>{after.insertAdjacentHTML("afterend",ingRow(v));after=after.nextElementSibling});
    schedule(); if(parts.length>1) toast(parts.length+" ingredienti separati")};
  $("#ingRows").addEventListener("paste",e=>{const inp=e.target.closest&&e.target.closest(".ingIn");if(!inp)return;
    const t=(e.clipboardData||window.clipboardData)?.getData("text")||"";const parts=splitIngs(t);
    if(parts.length<2&&!BUL.test(t))return; e.preventDefault();
    if(inp.value.trim()) parts.unshift(inp.value.trim()); fillFrom(inp,parts)});
  $("#ingRows").addEventListener("input",e=>{const inp=e.target;if(!inp.classList||!inp.classList.contains("ingIn"))return;
    if(BUL.test(inp.value)){const parts=splitIngs(inp.value);if(parts.length>1)fillFrom(inp,parts);else inp.value=parts[0]||""}});
  $("#ingRows").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("ingIn")){e.preventDefault();$("#addIng").click()}});
  $("#photoIn").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;resize(f,src=>{draft.photo=src;const pp=$("#pp");pp.querySelector("img,span")?.remove();pp.insertAdjacentHTML("afterbegin",`<img src="${src}" alt="">`)})});
  $("#ed").addEventListener("submit",async e=>{e.preventDefault();
    if(busy) return;
    if(!draft.kcalManual&&curIngs().length&&sig()!==draft.kcalSig){clearTimeout(timer);await calc()}
    if(!draft.kcalManual) draft.kcal=draft.kcalSig===sig()?Math.round((draft.kcalTotal||0)/servs()):0;
    draft.title=$("#fTitle").value.trim()||"Ricetta senza nome";draft.time=+$("#fTime").value||0;draft.servings=servs();
    draft.ingredients=curIngs();
    draft.steps=$("#fSteps").value.split("\n").map(s=>s.trim()).filter(Boolean);
    delete draft.example;
    const i=S.recipes.findIndex(x=>x.id===draft.id); if(i>=0)S.recipes[i]=draft; else S.recipes.unshift(draft);
    save(); toast("Ricetta salvata");
    if(curFolder)showFolder(curFolder);
    showRecipe(draft.id);
  });
}
function resize(file,cb){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};im.src=rd.result};rd.readAsDataURL(file)}

    <p class="hint-s">Spunta gli esercizi che hai fatto e aggiorna i kg. Nell'archivio finiscono con la data di oggi.</p>`,"p1");
  const find=el=>p.ex.find(x=>x.id===el.closest("[data-ex]")?.dataset.ex);
  const fit=t=>{t.style.height="auto";t.style.height=t.scrollHeight+"px"};
  document.querySelectorAll("#exList .ex-name").forEach(fit);
  $("#exList").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("ex-name")){e.preventDefault();e.target.blur()}});
  $("#wkName").addEventListener("input",e=>{p.name=e.target.value;save()});
  $("#exList").addEventListener("input",e=>{const ex=find(e.target),f=e.target.dataset.f;if(!ex||!f)return;if(f==="name")fit(e.target);
    const v=e.target.value; ex[f]=f==="sets"?(v===""?"":+v):f==="load"?(v===""?"":+v):v; save()});
  $("#exList").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const ex=find(b);if(!ex)return;
    if("exdone" in b.dataset){ex.done=!ex.done;b.closest(".ex").classList.toggle("done",ex.done);save()}
    else if("exrm" in b.dataset){p.ex=p.ex.filter(x=>x!==ex);b.closest(".ex").remove();$("#exN").textContent=p.ex.length;save();toast("Esercizio eliminato")}});
  $("#addEx").addEventListener("click",()=>{const ex={id:"e"+Date.now(),name:"",sets:"",reps:"",load:""};p.ex.push(ex);
    $("#exList").insertAdjacentHTML("beforeend",exRow(ex));$("#exN").textContent=p.ex.length;
    const all=$("#exList").querySelectorAll(".ex-name");all[all.length-1].focus();save()});
  $("#saveWk").addEventListener("click",()=>{
    const ex=p.ex.filter(e=>e.name.trim()); if(!ex.length){toast("Aggiungi almeno un esercizio");return}
    const k=dk(new Date()), now=new Date();
    const entry={id:"w"+Date.now(),day:i,name:p.name.trim()||DAYS[i],time:now.toTimeString().slice(0,5),
      ex:ex.map(e=>({name:e.name.trim(),sets:e.sets,reps:e.reps,load:e.load,done:!!e.done}))};
    S.wk.log[k]=(S.wk.log[k]||[]).filter(s=>s.day!==i).concat(entry);
    p.ex.forEach(e=>e.done=false); save(); toast("Allenamento salvato nell'archivio");
    archTab="wk"; showArchive();
  });
}
function showArchiveWk(){
  const days=Object.keys(S.wk.log).filter(d=>S.wk.log[d].length).sort().reverse();
  const sessions=days.reduce((a,d)=>a+S.wk.log[d].length,0);
  const now=new Date(), mKey=dk(now).slice(0,7);
  const month=days.filter(d=>d.startsWith(mKey)).length;
  const strip=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);strip.push({lab:d.toLocaleDateString("it-IT",{weekday:"short"}).slice(0,2),on:(S.wk.log[dk(d)]||[]).length>0})}
  const week=strip.filter(s=>s.on).length;
  const hist={};days.slice().reverse().forEach(d=>S.wk.log[d].forEach(s=>s.ex.forEach(e=>{if(e.load===""||e.load==null)return;const k=e.name.trim().toLowerCase();(hist[k]=hist[k]||{name:e.name.trim(),v:[]}).v.push(+e.load)})));
  const prog=Object.values(hist).filter(h=>h.v.length>1).slice(0,10);
  openPage(`<div class="hdr">${back("p1")}<h2>Archivio</h2></div>
    ${archSeg()}
    <section class="wkbox"><div class="eyebrow">Ultimi 7 giorni</div><h3>${week?`${week} allenament${week===1?"o":"i"} questa settimana`:"Nessun allenamento negli ultimi 7 giorni"}</h3>
      <div class="strip7">${strip.map(s=>`<div><i class="${s.on?"on":""}">${s.on?TICK.replace('stroke="#fff"','stroke="currentColor"'):""}</i>${s.lab}</div>`).join("")}</div></section>
    <div class="stats"><div class="stat"><b class="num">${sessions}</b><span>allenamenti totali</span></div><div class="stat"><b class="num">${month}</b><span>questo mese</span></div><div class="stat"><b class="num">${week}</b><span>in 7 giorni</span></div></div>
    ${prog.length?`<div class="block" style="margin-top:0"><h3>Progressi dei carichi</h3><ul class="prog">${prog.map(h=>{const a=h.v[0],b=h.v[h.v.length-1],d=b-a;return `<li><span>${esc(h.name)}</span><span class="${d>0?"up":"eq"}">${fmtKg(a)} → ${fmtKg(b)}${d>0?` (+${d.toLocaleString("it-IT")})`:""}</span></li>`}).join("")}</ul></div>`:""}
    <div class="sec"><h3>Giorno per giorno</h3></div>
    <div class="list">${days.length?days.map(d=>S.wk.log[d].map(s=>`<div class="day"><div class="dh"><b>${fmtDate(d)}</b><span class="badge b-good">${esc(s.name)}</span></div>
      <table class="wtable"><tbody>${s.ex.map(e=>`<tr class="${e.done===false?"skip":""}"><td>${esc(e.name)}</td><td>${e.sets?e.sets+" × ":""}${esc(e.reps||"")}</td><td>${fmtKg(e.load)}</td></tr>`).join("")}</tbody></table>
      <div class="dh" style="color:var(--muted);font-size:13px"><span>${s.ex.filter(e=>e.done!==false).length} / ${s.ex.length} esercizi fatti</span><span>ore ${s.time||""}</span></div></div>`).join("")).join("")
      :`<div class="empty">Ancora nessun allenamento salvato.<br>Apri un giorno dalla Home, spunta gli esercizi e tocca "Salva nell'archivio di oggi".</div>`}</div>`,"p1");
}

function setTab(n){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.go===n))}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.folder)showFolder(d.folder);
  else if(d.day!==undefined)showDay(+d.day);
  else if(d.arch){archTab=d.arch;showArchive()}
  else if(d.open)showRecipe(d.open);
  else if(d.edit)showEditor(d.edit);
  else if(d.close)closeLayer(d.close);
  else if(d.del){if(d.sure){S.recipes=S.recipes.filter(r=>r.id!==d.del);save();toast("Ricetta eliminata");$("#p2").hidden=true;if(curFolder)showFolder(curFolder);else closeLayer("p2")}else{d.sure=1;t.textContent="Tocca di nuovo per eliminare"}}
  else if(d.eat){const r=S.recipes.find(x=>x.id===d.eat);const k=dk(new Date());(S.log[k]=S.log[k]||[]).push(snap(r));save();renderHome();toast("Aggiunta all'archivio di oggi")}
  else if(d.act==="pick")showPicker();
  else if(d.go){$("#p2").hidden=true;if(d.go==="home"){closeLayer("p1")}else showArchive()}
  else if(t.id==="addBtn")showEditor();
  else if(t.id==="whoBtn")showProfiles();
});
/* calcola in sottofondo le kcal delle ricette che non le hanno ancora */
async function autoKcal(){
  const todo=S.recipes.filter(r=>!r.kcal&&!r.kcalManual&&(r.ingredients||[]).length).map(r=>r.id);
  for(const id of todo){
    const r=S.recipes.find(x=>x.id===id); if(!r||r.kcal) continue;
    try{
      const res=await fetch("/.netlify/functions/kcal",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:r.title,ingredients:r.ingredients})});
      const j=await res.json().catch(()=>({})); if(!res.ok||!Array.isArray(j.items)) return;
      const cur=S.recipes.find(x=>x.id===id); if(!cur||cur.kcal) continue;
      cur.kcalDetail=j.items;cur.kcalTotal=j.total;cur.kcalSig=JSON.stringify(cur.ingredients);cur.kcal=Math.round(j.total/(cur.servings||1));
      save(); if($("#p1").hidden&&$("#p2").hidden) renderHome();
    }catch(e){return}
    await new Promise(ok=>setTimeout(ok,2500));
  }
}
save();
renderHome();
setTimeout(autoKcal,1500);
</script>
